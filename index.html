function clearPops(){POPRES.splice(0).forEach(r=>r());[...document.body.children].filter(e=>e.style&&(e.style.zIndex=='98'||e.style.zIndex=='99')).forEach(e=>e.remove())}
function toHome(){newGame();nameUI();homeBar()}
async function goHome(){if(!confirm('กลับหน้าหลักและเริ่มใหม่? เกมนี้จะจบทันที (ถ้าอยู่ในห้อง จะยังอยู่ห้องเดิม)'))return;ABORTED=true;if(MP&&ROLE=='host'&&DB)DB.ref(P+'/ev').push({home:1,t:Date.now()});if(typeof S.hres=='function'){const q=S.hres;S.hres=null;q('done')}else S.hres=null;if(CANCEL)CANCEL();clearPops();for(let i=0;i<60&&RUNNING;i++)await new Promise(r=>setTimeout(r,100));if(MP&&ROLE=='guest'&&DB){['s','chat','ev','q'].forEach(k=>DB.ref(P+'/'+k).off());DB.ref(P+'/g').set(null)}toHome()}
function guestHomeEnter(){['s','chat','ev','q'].forEach(k=>DB.ref(P+'/'+k).off());clearPops();toHome()}
function leaveRoom(){if(DB&&P){if(ROLE=='host')DB.ref(P).remove();else DB.ref(P+'/join').remove();['s','chat','ev','q','a','g','join','start'].forEach(k=>DB.ref(P+'/'+k).off())}const ix=INV.findIndex(i=>i.id=='p2');if(ix>=0)INV.splice(ix,1);delete INV.slice;MP=false;ROLE='';P='';JOINED=null;LAST=null;hb=HBL;applyRole();toHome()}
function homeBar(){let h=`<div class='in'><p>🎛 เวอร์ชัน ${VERSION}${ROLE=='guest'?'':` · เทิร์น <b id='ntv'>${NT}</b> · เงินเริ่มต้น <b id='stv'>${f(START)}</b>`}</p>`;
if(ROLE!='guest')h+=[5,10,15,20,25,30].map(n=>`<button class='g' onclick='setNT(${n})'>${n}</button>`).join('')+'<br>'+[100000,200000,300000,400000,500000].map(n=>`<button class='g' onclick='setSTART(${n})'>${n/1000}k</button>`).join('')+'<br>';
if(P&&ROLE=='host')h+=`<p>🔑 ห้อง ${P.slice(6)}${JOINED?' · เพื่อนอยู่ในห้อง':' · รอเพื่อนเข้าห้อง'}</p><button onclick='mpStart()' ${JOINED?'':'disabled'}>▶ เริ่มเกมใหม่ในห้องนี้</button><button class='g' onclick='leaveRoom()'>🚪 ออกจากห้อง</button>`;
else if(P&&ROLE=='guest')h+=`<p>🔑 ห้อง ${P.slice(6)} · ⏳ รอโฮสต์เริ่มเกมใหม่</p><button class='g' onclick='leaveRoom()'>🚪 ออกจากห้อง</button>`;
else h+="<button onclick='startSolo()'>🔔 เริ่มเกมคนเดียว</button><button class='g' onclick='mpHost()'>👥 สร้างห้อง</button><button class='g' onclick='mpJoin()'>🔗 เข้าห้อง</button>";
h+="<button class='g' onclick='showLog()'>📜 บันทึกอัปเดต</button></div>";$('act').innerHTML=h}
const EMO=['🫵','😎','🤠','🦁','🐯','🐺','🦅','🐉','👑','🎩','🧙','🥷','🤖','👽','🦊','🐼'];
let ME={n:'คุณ',e:'🫵'};try{const j=JSON.parse(localStorage.getItem('pws_me')||'null');if(j&&j.n){ME.n=cln(j.n)||'คุณ';if(EMO.includes(j.e))ME.e=j.e}}catch(e){}
function applyMe(){INV[0].n=ME.n;INV[0].e=ME.e;try{localStorage.setItem('pws_me',JSON.stringify(ME))}catch(e){}}
function setEmo(e){ME.e=e;$('me').textContent=e;applyMe()}
function nameUI(){const d=document.createElement('div');d.style.cssText='background:var(--card);border:2px solid var(--gold);border-radius:10px;padding:8px;margin:8px 0';d.innerHTML=`<b>👤 ตัวละครของคุณ</b><br>ชื่อ: <input id='mn' maxlength='12' value='${ME.n}' style='font:inherit;font-weight:700;padding:6px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:150px'> <span id='me' style='font-size:26px'>${ME.e}</span><div>${EMO.map(e=>`<button class='g' style='padding:4px 8px;font-size:20px' onclick='setEmo("${e}")'>${e}</button>`).join('')}</div>`;$('app').prepend(d);$('mn').oninput=function(){ME.n=cln(this.value)||'คุณ';applyMe()};applyMe()}
let ROLEPICK='inv',SEATPICK=0,HMGR=false,MEID='you',MEMGR=null,GINV=false,LASTINP={};
const YOU_SEAT=INV[0],MGR0=MGR.map(m=>({n:m.n,e:m.e})),MEOBJ=()=>HMGR?MEMGR:(INV.find(i=>i.id=='you')||INV[0]);
const BOT0={id:'i0',n:'อาทิตย์',e:'🧭',t:'นักลงทุนสายสมดุล',st:'calc',pref:{g:.8,y:1,b:.6,r:.3},mx:.3,prem:.25,goal:2,pat:5,comp:.4,trend:.25,opt:0,loy:.6,tilt:.2,gamb:.3,gr:.4,rk:.45,exp:.5,dang:-3,imp:.1,mgn:.07,lam:.3,thr:.05,pn:.1,ag:.3,L:{want:'ใบนี้น่าสนใจ',up:'ผมขอเพิ่มอีกนิด',done:'พอแล้วสำหรับรอบนี้',win:'ได้ตามที่คิด',lose:'ครั้งหน้าเอาใหม่'}};
function applyMe(){YOU_SEAT.n=ME.n;YOU_SEAT.e=ME.e;if(MEMGR){MEMGR.n=ME.n;MEMGR.e=ME.e}try{localStorage.setItem('pws_me',JSON.stringify(ME))}catch(e){}}
function applyRole(){setupSeats({hr:ROLEPICK,hs:SEATPICK},'solo')}
function startSolo(){applyRole();newGame();begin()}
const jr=()=>{if(ROLE=='guest'&&DB&&P)DB.ref(P+'/join').set({n:ME.n,e:ME.e,role:ROLEPICK,seat:SEATPICK})};function pickRole(r){ROLEPICK=r;jr();homeBar()}function pickSeat(i){SEATPICK=i;jr();homeBar()}
const _hbar=homeBar;homeBar=function(){_hbar();{const e=document.querySelector('#act .in');if(e)e.insertAdjacentHTML('afterbegin',`<div style='margin:4px 0'>บทบาท: <button class='${ROLEPICK=='inv'?'':'g'}' onclick='pickRole("inv")'>🧑‍💼 นักลงทุน</button><button class='${ROLEPICK=='mgr'?'':'g'}' onclick='pickRole("mgr")'>🏛 ผู้จัดการ</button>${ROLEPICK=='mgr'?'<br>เล่นแทน: '+MGR0.map((m,i)=>`<button class='${SEATPICK==i?'':'g'}' onclick='pickSeat(${i})'>${m.e}${m.n}</button>`).join(''):''}</div>`)}};

async function humanPrice(m,cs){if(!cs.length)return;const tl=NT+1-S.T;cs.forEach(c=>{c.min=r5(c.b+1500+(c.over||0)/tl+c.b*.2);c.counter=0;c.shown=null});
await askM(m,'🏷 ตั้งราคาป้ายขั้นต่ำของหุ้นที่คุณถืออยู่ (ภาษี $2,000/ใบ/เทิร์น · ตอนคืนหุ้นคุณจ่ายนักลงทุนคืนที่ราคาต้นทุน)',`<div style='max-height:42vh;overflow:auto'>${cs.map(c=>`<div style='margin:4px 0'>${COL[c.k].e}×${c.x} ต้นทุน ${f(c.b)} · หลอด ${(S.g&&S.g[c.k])||0} · ป้าย <input data-cid='${c.id}' type='number' step='500' value='${c.min}' onchange='ALL[${c.id}].min=Math.max(0,r5(+this.value||0))' style='width:110px;font:inherit;padding:4px'></div>`).join('')}</div><button onclick='hb(1)'>ยืนยันราคา ▶</button>`,1);Object.entries(LASTINP||{}).forEach(([id,val])=>{if(ALL[id])ALL[id].min=Math.max(0,r5(+val||0))});
await say(NAR,`🏷 ${m.e} ${m.n} ตั้งป้าย: ${cs.map(c=>COL[c.k].e+'×'+c.x+' '+f(c.min)).join(' · ')}`)}
async function humanSell(m,c,bids,it){const k=COL[c.k],g=(S.g&&S.g[c.k])||0;
const v=await askM(m,`🏷 ${k.e}×${c.x} (ต้นทุน ${f(c.b)} · ป้ายคุณ ${f(c.min)} · หลอด ${g}) มี ${bids.length} ข้อเสนอ — ขายให้ใคร? <span class='sm'>(รอบย่อย ${it}/6)</span>`,`<div style='max-height:40vh;overflow:auto'>`+bids.map((o,i)=>`<button ${S.cash[o.i.id]<o.p?'disabled':''} onclick='hb(${i})'>${o.i.e}${o.i.n} ${f(o.p)}${o.p<c.min?' ⚠️ต่ำกว่าป้าย':''}</button>`).join('')+`</div><button class='g' onclick='hb(-1)'>ยังไม่ขาย · ขอราคาสูงกว่า</button>`,-1);
if(v>=0){const w=bids[v],wi=w.i;S.cash[wi.id]-=w.p;S.cash[m.id]+=w.p;c.seller=m;c.paid=w.p;c.own=wi;S.got[wi.id]++;INV.forEach(i=>delete S.B[i.id][c.id]);c.shown=null;R[m.id][wi.id]=cl10(relOf(m,wi)+1.5);bids.forEach(o=>{if(o.i!==wi){G[o.i.id][wi.id]=Math.min(10,(G[o.i.id][wi.id]||0)+.8+(o.i.gr||0));FR[o.i.id]=(FR[o.i.id]||0)+1}});FR[wi.id]=0;await say(m,`ขาย ${k.e}×${c.x} ให้ ${wi.n} ${f(w.p)}`);if(wi.L)await say(wi,wi.L.win);const lo=bids.filter(o=>o.i!==wi);if(lo.length)await say(lo[0].i,lo[0].i.L.lose+` (เสนอ ${f(lo[0].p)})`)}
else{c.counter=r5(Math.max(c.min,bids[0].p*1.08));await say(m,`ยังไม่พอใจ ${f(bids[0].p)} ขอ ${f(c.counter)}`)}}
function fin(){draw();const a=[...INV].sort((x,y)=>net(y)-net(x)),b=[...MGR].sort((x,y)=>net(y)-net(x)),A=a[0],M=b[0],W=net(A)>=net(M)?A:M,rk=HMGR?(b.findIndex(x=>x===MEMGR)+1)+'/'+MGR.length+' ของผู้จัดการ':(a.findIndex(x=>x.id=='you')+1)+'/'+INV.length+' ของนักลงทุน';
setAct(`<p>🏆 จบเกม! นักลงทุนชนะ: ${A.e}${A.n} (${f(net(A))}) · ผู้จัดการชนะ: ${M.e}${M.n} (${f(net(M))})<br>ผู้ชนะสูงสุด: <b>${W.e}${W.n}</b> · คุณได้อันดับ ${rk}</p><button onclick='toHome()'>กลับหน้าหลัก</button>`);say(NAR,'🏁 ครบ '+NT+' เทิร์น — ดูมูลค่าสุทธิที่ “เงินและมูลค่าสุทธิทุกคน”')}
const P2_SEAT={id:'p2',n:'ผู้เล่น 2',e:'🧑',t:'ผู้เล่นจริง',remote:true,pref:{r:.5,b:.5,y:.5,g:.5},loy:1,L:{want:'',up:'',done:'พอแล้ว',win:'(ได้การ์ดแล้ว)',lose:'(พลาดไป)'}},BOTS=INV.slice(1);
function setupSeats(cfg,side,gi){MGR.forEach((m,i)=>{delete m.human;m.n=MGR0[i].n;m.e=MGR0[i].e});delete INV.slice;INV.length=0;MEMGR=null;const hm=cfg.hr=='mgr';
if(side=='guest'){const hostInv=!hm,gm=cfg.gr=='mgr';if(!hostInv)INV.push(BOT0);INV.push(...BOTS);YOU_SEAT.n=gi.gn;YOU_SEAT.e=gi.ge;if(!gm)INV.push(YOU_SEAT);if(hostInv){P2_SEAT.n=gi.hn;P2_SEAT.e=gi.he;INV.push(P2_SEAT)}HMGR=gm;GINV=!gm;if(hm){const h=MGR[cfg.hs];h.human='host';h.n=gi.hn;h.e=gi.he}if(gm){MEMGR=MGR[cfg.gs];MEMGR.human='guest';MEMGR.n=gi.gn;MEMGR.e=gi.ge}}
else{INV.push(hm?BOT0:YOU_SEAT,...BOTS);HMGR=hm;GINV=false;if(side=='host'&&cfg.gr=='inv'){P2_SEAT.n=gi.n;P2_SEAT.e=gi.e;INV.push(P2_SEAT);GINV=true}if(hm){MEMGR=MGR[cfg.hs];MEMGR.human=side=='host'?'host':true;MEMGR.n=ME.n;MEMGR.e=ME.e}if(side=='host'&&cfg.gr=='mgr'){const g=MGR[cfg.gs];g.human='guest';g.n=gi.n;g.e=gi.e}}
MEID=MEMGR?MEMGR.id:'you';INV.slice=function(a,b){const all=this[0]!==YOU_SEAT,x=Array.prototype.slice.call(this,(a===1&&b===undefined&&all)?0:a,b);return a===1&&b===undefined?x.filter(i=>!i.remote):x}}
const collectInp=()=>{const o={};document.querySelectorAll('#act input[data-cid]').forEach(e=>{o[e.dataset.cid]=+e.value});return o};
const HBL=function(k){LASTINP=collectInp();HB0(k)};hb=HBL;
const askM=(m,q,html,def)=>m.human==='guest'?remoteAsk(q,html,def):wait(q,html);
function remoteAsk(q,html,def){setAct('<p>⏳ รอเพื่อนตัดสินใจ...</p>');const id=Date.now()+Math.random();DB.ref(P+'/q').set({id,q,html});return new Promise(res=>{let t;const ref=DB.ref(P+'/a'),h=ref.on('value',s=>{const v=s.val();if(v&&v.id==id){ref.off('value',h);clearTimeout(t);DB.ref(P+'/q').set(null);LASTINP=v.inp||{};res(v.v)}});t=setTimeout(()=>{ref.off('value',h);DB.ref(P+'/q').set(null);LASTINP={};res(def)},180000);CANCEL=()=>{ref.off('value',h);clearTimeout(t);res(def)}})}
init();nameUI();homeBar();
</script></body></html>
